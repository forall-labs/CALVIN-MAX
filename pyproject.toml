[project]
name = "calvin-max"
version = "0.0.1"
description = "CALVIN-MAX: a mid-execution change benchmark for CALVIN, compatible with LIBERO-MAX"
requires-python = ">=3.10"
dependencies = ["numpy"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
